# ═══════════════════════════════════════════════════════════════════════════
# Overlay for serving AWARE behind a reverse proxy on the host
# ═══════════════════════════════════════════════════════════════════════════
# Use together with the production compose file:
#
#   docker compose -f docker-compose.prod.yaml -f docker-compose.caddy.yaml up -d
#
# Keeps the bundled nginx from starting, because the host's Caddy already owns
# 80/443, and points the dashboard at same-origin API calls so the proxy only
# has to forward one port.
# ═══════════════════════════════════════════════════════════════════════════

services:
  # Parked behind a profile that is never enabled: still defined, never starts.
  nginx:
    profiles:
      - unused-nginx

  web:
    build:
      args:
        # Empty on purpose. The browser then calls /api/... on the current
        # origin and next.config.js rewrites it to the API container, so the
        # domain never gets compiled into the client bundle and Caddy needs a
        # single reverse_proxy line.
        NEXT_PUBLIC_API_URL: ""
        # next.config.js resolves its rewrites at build time as well.
        API_INTERNAL_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: ""
      # Where those rewrites actually go, over the compose network.
      API_INTERNAL_URL: http://api:8000
