name: aware-production

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  redpanda:
    image: redpandadata/redpanda:v24.2.11
    container_name: aware-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "2"
      - --memory
      - "2G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:29092,EXTERNAL://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: aware-clickhouse
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ../analytics-service/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ../analytics-service/clickhouse/users.d/network-access.xml:/etc/clickhouse-server/users.d/network-access.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # JAVA SERVICES (Polybot Trading Infrastructure)
  # ═══════════════════════════════════════════════════════════════════════════

  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
      args:
        SERVICE: executor-service
    container_name: aware-executor
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY}
      POLYMARKET_API_SECRET: ${POLYMARKET_API_SECRET}
      POLYMARKET_PASSPHRASE: ${POLYMARKET_PASSPHRASE}
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY}
      HFT_MODE: ${HFT_MODE:-PAPER}
      JAVA_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "127.0.0.1:${EXECUTOR_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/polymarket/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  strategy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
      args:
        SERVICE: strategy-service
    container_name: aware-strategy
    depends_on:
      executor:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      EXECUTOR_BASE_URL: http://executor:8080
      HFT_MODE: ${HFT_MODE:-PAPER}
      JAVA_OPTS: "-Xmx2g -Xms1g"
    ports:
      - "127.0.0.1:${STRATEGY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/strategy/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ingestor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
      args:
        SERVICE: ingestor-service
    container_name: aware-ingestor
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      JAVA_OPTS: "-Xmx1g -Xms512m"
    ports:
      - "127.0.0.1:${INGESTOR_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # PYTHON SERVICES (AWARE Fund Analytics)
  # ═══════════════════════════════════════════════════════════════════════════

  analytics:
    build:
      context: ../aware-fund/services/analytics
      dockerfile: Dockerfile
    container_name: aware-analytics
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_NATIVE_PORT: 9000
      CLICKHOUSE_DATABASE: polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      SCORING_INTERVAL_SECONDS: 3600
      LOG_LEVEL: INFO
    restart: unless-stopped

  api:
    build:
      context: ../aware-fund/services/api
      dockerfile: Dockerfile
    container_name: aware-api
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: polybot
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # curl is not in the image; python is. The local compose file already
      # does it this way. 127.0.0.1 rather than localhost for the same reason
      # as the web service.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # WEB DASHBOARD
  # ═══════════════════════════════════════════════════════════════════════════

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Empty on purpose: the browser calls /api/... on the current origin
        # and next.config.js rewrites it to the API, so Caddy proxies a single
        # service and the domain never gets compiled into the client bundle.
        NEXT_PUBLIC_API_URL: ""
        # next.config.js resolves its rewrites at build time as well, so the
        # target has to be known here rather than at runtime.
        API_INTERNAL_URL: http://api:8000
    container_name: aware-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: Next.js listens on 0.0.0.0 (IPv4 only) while
      # localhost resolves to ::1 first inside the container, so the check was
      # refused and the service never became healthy.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # REVERSE PROXY (Caddy — automatic TLS)
  # ═══════════════════════════════════════════════════════════════════════════

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: aware-caddy
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      AWARE_DOMAIN: ${AWARE_DOMAIN:?set AWARE_DOMAIN in .env}
      AWARE_USER: ${AWARE_USER:-admin}
      # Single-quote the hash in .env or compose eats its $ segments.
      AWARE_PASSWORD_HASH: ${AWARE_PASSWORD_HASH:?set AWARE_PASSWORD_HASH in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume Caddy re-requests them on
      # every recreate and hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aware-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: aware-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  redpanda_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  # TLS certificates. Losing this means re-requesting them from Let's Encrypt.
  caddy_data:
  caddy_config:

networks:
  default:
    name: aware-network
