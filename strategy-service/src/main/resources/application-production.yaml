# ═══════════════════════════════════════════════════════════════════════════════
# AWARE Fund - Production Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# This profile is activated via SPRING_PROFILES_ACTIVE=production
# Sensitive values are loaded from environment variables
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  threads:
    virtual:
      # Off for this service, overriding polybot-common.yaml.
      #
      # On JDK 21 a virtual thread that enters a synchronized block pins its
      # carrier until it leaves (JEP 491 lifts this, in 24). HikariCP and the
      # ClickHouse JDBC driver both synchronize on the connection path, and this
      # service does blocking JDBC in a one-second loop across six funds. With
      # four carriers on this host, a handful of concurrent borrows pins every
      # one of them and everything else running on a virtual thread starves:
      # the scheduled tasks, the HTTP endpoints, and the arbitrage engine, which
      # touches no database at all.
      #
      # That is the shape of both outages — the service traded for three
      # minutes after a restart and then went silent for hours while its
      # container reported "Up" and its health endpoint never answered. Platform
      # threads with a sized pool are the right tool for a blocking workload.
      enabled: false
  task:
    scheduling:
      pool:
        # Spring schedules on a single thread by default, so one blocked JDBC
        # call stopped the mirror funds AND the arbitrage engine — which is how
        # a stale connection pool took the whole service down for 41 hours.
        # Enough threads that a stalled fund poll costs that poll alone.
        size: 8
  datasource:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://clickhouse:8123/polybot}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    hikari:
      # ClickHouse hangs up on an idle connection after keep_alive_timeout. The
      # pool has to retire its connections before that happens, or it hands out
      # dead handles and every borrow blocks for the full timeout. These sit
      # under the 60s the server now allows.
      max-lifetime: 45000
      keepalive-time: 30000
      idle-timeout: 20000
      minimum-idle: 2
      maximum-pool-size: 15
      # Fail in five seconds rather than thirty. A borrow that blocks is a
      # scheduled task that blocks, and the point is to lose one poll rather
      # than wedge the service.
      connection-timeout: 5000
      validation-timeout: 3000
      connection-test-query: SELECT 1
      # Say so in the log when a connection is held far too long, instead of
      # leaving an exhausted pool to be inferred from its symptoms.
      leak-detection-threshold: 60000

hft:
  # Trading mode: PAPER (simulation) or LIVE (real money!)
  mode: ${HFT_MODE:PAPER}

  # ═══════════════════════════════════════════════════════════════════════════
  # AWARE Fund Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  fund:
    enabled: true
    index-type: PSI-10
    capital-usd: ${FUND_CAPITAL_USD:10000}
    max-position-pct: 0.10
    min-trade-usd: 10
    rebalance-interval-seconds: 60
    signal-delay-seconds: 5
    max-slippage-pct: 0.02
    execution-mode: LIMIT_THEN_MARKET
    risk-limits:
      max-daily-loss-usd: ${MAX_DAILY_LOSS_USD:500}
      max-drawdown-pct: 0.10
      max-open-positions: 50
      max-single-market-exposure-usd: 1000
      kill-switch-active: false
      # Ceiling on a fund's total open cost, as a fraction of its capital. The
      # limits above each bound one trade; this bounds their sum. Below 1.0 on
      # purpose: open positions are counted from memory and a settled one stays
      # there until its resolution is seen, so the figure runs high, and fills
      # can land above the limit price within the slippage allowance. The funds
      # currently sit under 10%, so this is a circuit breaker, not a constraint.
      max-exposure-pct: 0.90

  # ═══════════════════════════════════════════════════════════════════════════
  # Multi-Fund Mode Configuration
  # ═══════════════════════════════════════════════════════════════════════════
  multi-fund:
    enabled: true
    total-capital-usd: ${TOTAL_CAPITAL_USD:100000}

    funds:
      # TIER 1: PSI Mirror Funds
      PSI-10:
        enabled: true
        capital-pct: 15
        max-position-pct: 0.10
        min-trade-usd: 10

      PSI-25:
        enabled: true
        capital-pct: 10
        max-position-pct: 0.08
        min-trade-usd: 10

      PSI-CRYPTO:
        enabled: true
        capital-pct: 10
        max-position-pct: 0.10
        min-trade-usd: 10

      PSI-POLITICS:
        enabled: true
        capital-pct: 10
        max-position-pct: 0.10
        min-trade-usd: 10

      PSI-SPORTS:
        enabled: true
        capital-pct: 5
        max-position-pct: 0.15
        min-trade-usd: 10

      PSI-ALPHA:
        enabled: true
        capital-pct: 10
        max-position-pct: 0.12
        min-trade-usd: 10

      # TIER 2: Alpha Active Funds
      ALPHA-ARB:
        enabled: true
        capital-pct: 15
        max-position-pct: 0.05
        min-trade-usd: 20

      ALPHA-INSIDER:
        enabled: true
        capital-pct: 17
        max-position-pct: 0.15
        min-trade-usd: 25

      ALPHA-EDGE:
        enabled: true
        capital-pct: 8
        max-position-pct: 0.10
        min-trade-usd: 20

  events:
    enabled: true
    market-ws-snapshot-publish-millis: 1000
    market-ws-cache-publish-on-start: true

  executor:
    base-url: ${EXECUTOR_BASE_URL:http://executor:8080}
    # Spring does not evaluate expressions in property values: the previous
    # `${HFT_MODE:PAPER} == "LIVE"` reached the binder as the literal string
    # 'PAPER == "LIVE"' and failed to convert to Boolean, so the service could
    # not start at all. Driven by its own flag instead.
    send-live-ack: ${HFT_SEND_LIVE_ACK:false}

  risk:
    kill-switch: false
    max-order-notional-usd: ${MAX_ORDER_NOTIONAL_USD:1000}
    max-order-size: 100

  polymarket:
    market-ws-enabled: true
    gamma-url: https://gamma-api.polymarket.com
    market-ws-cache-path: /tmp/market-ws-cache.json
    market-ws-cache-flush-millis: 5000

  strategy:
    gabagool:
      enabled: true
      refresh-millis: 1500
      min-replace-millis: 2000
      force-replace-millis: 20000
      min-seconds-to-end: 0
      max-seconds-to-end: 3600
      improve-ticks: 0
      quote-size: 18
      bankroll-mode: FIXED
      bankroll-usd: ${GABAGOOL_BANKROLL_USD:10000}

# Production logging (less verbose)
logging:
  level:
    root: INFO
    com.polybot.hft: INFO
    com.polybot.hft.polymarket.strategy: INFO
    org.springframework: WARN

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
